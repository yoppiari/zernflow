services:
  app:
    container_name: zernflow-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://flows.lumiku.com}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://flows.lumiku.com/supabase-api}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjIwMDAwMDAwMDB9.u3UJmlACRBhhRNLzzvqWfTah0lGJVYemFXzwU5sufBA}
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - coolify
    environment:
      - SERVICE_FQDN_APP_3000=${SERVICE_FQDN_APP_3000:-https://flows.lumiku.com}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://flows.lumiku.com}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://flows.lumiku.com/supabase-api}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjIwMDAwMDAwMDB9.u3UJmlACRBhhRNLzzvqWfTah0lGJVYemFXzwU5sufBA}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.xdTcldRhvmKPkJMXRTBy4xmKr3XCRpjgRuMjDpjU0fg}
      - CRON_SECRET=${CRON_SECRET:-cron-secret-zernflow-lumiku}
      - INTERNAL_AUTH_URL=http://zernflow-auth:9999
      - INTERNAL_REST_URL=http://zernflow-rest:3000
    depends_on:
      - auth
      - rest
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth:
    container_name: zernflow-auth
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    networks:
      - coolify
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://supabase_auth_admin:${DB_PASSWORD:-postgres_password_zernflow_secure}@zernflow-db:5432/postgres
      - GOTRUE_SITE_URL=${NEXT_PUBLIC_APP_URL:-https://flows.lumiku.com}
      - GOTRUE_URI_ALLOW_LIST=*
      - GOTRUE_DISABLE_SIGNUP=true
      - GOTRUE_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-chars-zernflow}
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_JWT_ADMIN_ROLES=service_role
      - GOTRUE_JWT_AUD=authenticated
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=true
      - GOTRUE_MAILER_AUTOCONFIRM=true
    depends_on:
      - db

  rest:
    container_name: zernflow-rest
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    networks:
      - coolify
    environment:
      - PGRST_DB_URI=postgres://authenticator:${DB_PASSWORD:-postgres_password_zernflow_secure}@zernflow-db:5432/postgres
      - PGRST_DB_SCHEMAS=public,storage,graphql_public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-chars-zernflow}
      - PGRST_DB_USE_LEGACY_GUCS=false
    depends_on:
      - db

  db:
    container_name: zernflow-db
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    networks:
      - coolify
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres_password_zernflow_secure}
      - POSTGRES_DB=postgres
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-chars-zernflow}
    volumes:
      - zernflow_db_data:/var/lib/postgresql/data

volumes:
  zernflow_db_data:

networks:
  coolify:
    external: true
